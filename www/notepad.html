<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notepad</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  background:#fff;
  color:#111;
}
body{
  overflow:hidden;
}
.back-btn{
  position:fixed;
  top:12px;
  left:12px;
  z-index:1000;
  width:42px;
  height:42px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,.96);
  color:#111;
  font-size:26px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.16);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.back-btn:active{
  transform:scale(.94);
  background:#f1f1f1;
}
.page{
  height:100vh;
  overflow:auto;
  background-color:#fff;
  background-image:
    radial-gradient(circle, rgba(0,0,0,.22) 1.1px, transparent 1.2px);
  background-size:24px 24px;
  background-position:12px 12px;
}
#editor{
  min-height:calc(100vh + 500px);
  padding:68px 20px 120px;
  outline:none;
  font-size:20px;
  font-weight:700;
  line-height:1.7;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  caret-color:#111;
}
#editor:empty:before{
  content:"এখানে লিখুন...";
  color:#8b8b8b;
  font-weight:600;
}
.save-status{
  position:fixed;
  right:14px;
  bottom:16px;
  padding:7px 10px;
  border-radius:9px;
  background:rgba(17,17,17,.85);
  color:#fff;
  font-size:11px;
  font-weight:700;
  opacity:0;
  transition:.2s ease;
  pointer-events:none;
  z-index:1000;
}
.save-status.show{opacity:1}
</style>
</head>
<body>

<button type="button" id="backBtn" class="back-btn" aria-label="Main App-এ ফিরে যান">‹</button>

<div class="page" id="page">
  <div id="editor" contenteditable="true" spellcheck="false"></div>
</div>

<div id="saveStatus" class="save-status">Saved</div>

<script>
(function(){
  "use strict";

  var KEY = "simple_notepad_v2";
  var MAIN_APP_URL = "index.html";

  var editor = document.getElementById("editor");
  var page = document.getElementById("page");
  var status = document.getElementById("saveStatus");
  var backBtn = document.getElementById("backBtn");
  var timer = null;
  var isLeaving = false;

  function showSaved(){
    status.classList.add("show");
    clearTimeout(showSaved.timer);
    showSaved.timer = setTimeout(function(){
      status.classList.remove("show");
    },900);
  }

  function save(showMessage){
    localStorage.setItem(KEY, editor.innerHTML);
    if(showMessage !== false){
      showSaved();
    }
  }

  function goToMainApp(){
    if(isLeaving) return;
    isLeaving = true;
    save(false);
    window.location.replace(MAIN_APP_URL);
  }

  function placeCaretAtEnd(element){
    var range = document.createRange();
    var selection = window.getSelection();
    range.selectNodeContents(element);
    range.collapse(false);
    selection.removeAllRanges();
    selection.addRange(range);
  }

  editor.innerHTML = localStorage.getItem(KEY) || "";

  editor.addEventListener("input", function(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      save(true);
    },180);
  });

  backBtn.addEventListener("click", function(){
    goToMainApp();
  });

  try{
    history.pushState({notepadOpen:true}, "", window.location.href);
  }catch(error){
    console.log("History state error:", error);
  }

  window.addEventListener("popstate", function(){
    goToMainApp();
  });

  page.addEventListener("click", function(e){
    if(e.target !== page) return;

    var editorRect = editor.getBoundingClientRect();
    var currentHeight = editor.scrollHeight;
    var clickedY = e.clientY - editorRect.top + page.scrollTop;
    var lineHeight = 34;

    if(clickedY > currentHeight - 20){
      var extraLines = Math.max(1, Math.ceil((clickedY - currentHeight) / lineHeight) + 1);
      for(var i=0; i<extraLines; i++){
        var line = document.createElement("div");
        line.innerHTML = "<br>";
        editor.appendChild(line);
      }
      save(true);
    }

    editor.focus();
    placeCaretAtEnd(editor);
  });

  window.addEventListener("beforeunload", function(){
    save(false);
  });

  window.addEventListener("pagehide", function(){
    save(false);
  });
})();
</script>

</body>
</html>
